task_id: TASK-0005-orchestrator-verifier-watchdog
objective: >
  Implement the Orchestrator role (docs/AGENT_ROLES.md §7) as deterministic
  Python code per DEC-010 (supersedes DEC-007's n8n-as-Orchestrator design):
  claim/dispatch/apply against TASK-0003's Postgres store using TASK-0004's
  headless worker contract, plus an independent Verifier and a Watchdog.
  Deliberately stops short of auto-dispatching the CHECKPOINT (commit/push)
  step itself -- that remains a human-directed Builder session.

status: COMPLETED

assigned_agent: Builder

priority: P0

requirements:
  - Generalize TASK-0003's READY-only atomic claim to every state with a
    worker-dispatchable next_agent (Researcher/Builder/Tester/Reviewer),
    without touching Architect/Chairman/Human-owned states.
  - Deterministic state-machine transitions per tasks/README.md §
    Lifecycle -- no LLM call decides the next status.
  - Record agent_invocations (start/complete), task_events, and
    human_required_queue rows for every dispatch, matching TASK-0003's
    schema exactly.
  - Independent Verifier: secrets scan, unintended-changes-vs-declared-scope
    check, and real test-command execution -- no LLM call, runs in addition
    to (not instead of) the adversarial Reviewer-role worker invocation.
  - Watchdog: lease-expiry sweep, retry-exhaustion escalation to
    HUMAN_REQUIRED, dead-invocation detection, cost-audit signal logging
    (not an auto-pause, per docs/TOKEN_EFFICIENCY.md's already-decided
    scope).
  - Validate end-to-end against an ephemeral, throwaway Postgres container
    -- never the persistent marcos-tasks-db service.
  - Do not auto-dispatch a headless Builder invocation to perform the
    9-step checkpoint procedure against a real repository (HUMAN_REQUIRED_
    QUEUE.md #2's concern, enforced structurally by excluding CHECKPOINT
    from the dispatchable status set).
  - Never commit secrets; never merge into main.

