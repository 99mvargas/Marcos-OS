task_id: TASK-0001-autonomous-agent-protocol-bootstrap
objective: >
  Design and document the Marcos OS Autonomous Agent Protocol v1.0 -- formal
  roles, shared task-state schema, checkpoint system, git workflow, human
  interruption protocol, and safety boundaries -- so agents can hand off
  work through GitHub instead of through Marcos relaying messages between
  them. Documentation/architecture only; no application code, infrastructure,
  or orchestration implemented.

status: CHECKPOINT

assigned_agent: Builder

priority: P0

requirements:
  - Inspect the existing repository and preserve current architecture/docs.
  - Define 7 formal roles (Chairman, Architect, Researcher, Builder,
    Reviewer, Tester, Orchestrator) with responsibilities, allowed/prohibited
    actions, inputs, outputs, handoff conditions.
  - Define a machine-readable task/checkpoint schema and lifecycle.
  - Define the checkpoint system (9-step procedure).
  - Define a safe git workflow (branch naming, no autonomous merge to main).
  - Define the human interruption protocol and schema.
  - Define safety boundaries across read-only/reversible/repo/infra/
    production/destructive/external-side-effect categories.
  - Define the quality control / adversarial review process.
  - Describe (but do not implement) the future n8n orchestration flow.
  - Consolidate with existing docs rather than duplicating them.
  - No Docker, n8n, Home Assistant, Proxmox, networking, credentials, OAuth,
    or production infrastructure modified.
  - No application code created or modified.
  - No existing files deleted.

