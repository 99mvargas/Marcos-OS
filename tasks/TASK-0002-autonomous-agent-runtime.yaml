task_id: TASK-0002-autonomous-agent-runtime
objective: >
  Design the practical, secure, resumable runtime architecture that makes
  the Autonomous Agent Protocol v1.0 (TASK-0001) operational -- the
  division of responsibility between GitHub, PostgreSQL, n8n, Claude Code,
  and OpenAI/ChatGPT, the invocation/communication/retry/security model,
  and an implementation sequence. Research and architecture only; no
  runtime, database, n8n workflow, or infrastructure implemented.

status: CHECKPOINT

assigned_agent: Builder

priority: P0

requirements:
  - Inspect the current repository, the TASK-0001 checkpoint branch, and
    (read-only) the live n8n instance before proposing anything.
  - Evaluate the correct division of responsibility across GitHub,
    PostgreSQL, n8n, Claude Code, OpenAI/ChatGPT, MCP, the Builder VM,
    Home Assistant, and Obsidian -- do not assume GitHub YAML remains the
    live runtime database.
  - Decide explicitly whether ChatGPT/Architect participation should be
    synchronous (app-based) or API-backed, and justify the answer.
  - Decide explicitly whether the long-term design should support multiple
    AI providers, and to what extent, without overbuilding now.
  - Produce all 26 required deliverable sections (current-state assessment
    through risks/mitigations).
  - Define least-privilege security, authn/authz, audit, and safety-
    boundary enforcement for every new component.
  - Do not modify n8n, Docker, Proxmox, Home Assistant, networking,
    credentials, or production services.
  - Do not merge into main.
  - Do not delete or contradict existing documentation; identify and
    resolve any conflicts explicitly.
  - Do not falsely mark this task COMPLETED if implementation had begun --
    it has not; this task is documentation/architecture only.

