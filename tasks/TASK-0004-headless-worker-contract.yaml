task_id: TASK-0004-headless-worker-contract
objective: >
  Build and empirically validate the headless worker invocation contract for
  both Claude Code and Codex: a bounded adapter (task + worktree + explicit
  role + acceptance criteria -> structured WorkerResult) with per-role
  permission profiles enforced at the tool-allowlist level, per
  docs/RUNTIME_ARCHITECTURE.md §9/§22 item 2. Does not implement the
  Orchestrator that dispatches these invocations (TASK-0005) and does not
  start the persistent marcos-tasks-db container.

status: COMPLETED

assigned_agent: Builder

priority: P0

requirements:
  - Implement a structured result contract (WorkerResult) that the
    Orchestrator/Verifier read instead of parsing prose, per
    AUTONOMOUS_AGENT_PROTOCOL.md's "structured artifacts, not prose"
    requirement.
  - Implement per-role permission profiles for both providers matching
    docs/RUNTIME_ARCHITECTURE.md §9's table (Researcher/Tester/Reviewer:
    read-only, no Edit/Write/commit/push; Builder: read/write + Bash +
    commit/push to non-main).
  - Never emit a full permission-bypass flag for either provider
    (bypassPermissions/--dangerously-skip-permissions/
    --dangerously-bypass-approvals-and-sandbox) regardless of role -- see
    DEC-011.
  - Empirically verify (not assume from documentation) that each role
    profile actually runs headlessly without hanging and that the tool
    allowlist is a real boundary, not just a documented intent.
  - Record token/cost telemetry fields compatible with
    agent_invocations' schema (TASK-0003) on every result, even though no
    live Postgres write happens in this task.
  - Save full raw transcripts to disk (not inlined in the result) per
    docs/TOKEN_EFFICIENCY.md's context-minimization rules.
  - Do not implement the n8n/Python Orchestrator, Verifier, or Watchdog
    (TASK-0005).
  - Do not start the persistent marcos-tasks-db container (HUMAN APPROVAL
    per AUTONOMOUS_AGENT_PROTOCOL.md §10) -- record as HUMAN_REQUIRED
    instead.
  - Do not perform a real Builder-role (file-editing) headless dry run
    against this actual repository without a human-approved, scoped task --
    record as HUMAN_REQUIRED instead; a Builder-profile write-path smoke
    test against an isolated scratchpad directory (not this repo) is
    sufficient evidence the mechanism works.
  - Never commit secrets; never merge into main.

