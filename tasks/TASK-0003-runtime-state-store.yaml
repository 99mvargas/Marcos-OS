task_id: TASK-0003-runtime-state-store
objective: >
  Implement the smallest production-quality foundation for the autonomous
  runtime designed in TASK-0002: the PostgreSQL operational state store
  (tasks, task_events, agent_invocations, human_required_queue,
  checkpoints) plus AI invocation cost/token observability, as plain SQL
  migrations and a thin typed access layer. Does not implement the n8n
  Orchestrator or any Claude/OpenAI invocation -- those are TASK-0004/0005.

status: CHECKPOINT

assigned_agent: Builder

priority: P0

requirements:
  - Inspect docs/RUNTIME_ARCHITECTURE.md, docs/AUTONOMOUS_AGENT_PROTOCOL.md,
    docs/AGENT_ROLES.md, BUILD_STATE.md, apps/marcos-api, existing Docker
    Compose config, existing task schemas, and .claude configuration before
    changing anything.
  - Every agent_invocations row must record at minimum invocation_id,
    task_id, role, provider, model, input_tokens, output_tokens,
    total_tokens, estimated_cost, duration_ms, status, retry_count,
    timestamp.
  - Deterministic operations (claiming, locking, lease sweeps, cost math,
    event logging, git operations) must never consume an LLM call.
  - Support targeted context selection -- no full-repository dump to
    agents by default.
  - Allow future model selection to pick the lowest-cost model capable of
    a task.
  - Add PostgreSQL using the smallest maintainable implementation
    consistent with TASK-0002 (docs/RUNTIME_ARCHITECTURE.md section 6/20).
  - Add versioned, forward-only SQL migrations (no ORM unless justified --
    none was).
  - Implement the five task/runtime tables from TASK-0002 section 6.
  - Add indexes and constraints for atomic task claiming, leases,
    idempotency, and auditability.
  - Do not migrate unrelated finance, Home Assistant, or existing
    application data.
  - Do not redesign TASK-0002.
  - Do not implement the complete n8n orchestrator.
  - Do not implement Claude/OpenAI invocation.
  - Do not modify Proxmox, Home Assistant, network configuration, or
    unrelated production services.
  - Never expose or commit credentials/secrets.
  - Do not merge into main.
  - Write docs/TOKEN_EFFICIENCY.md covering token sources, minimization
    rules, model-selection rules, retry limits, budgets, required
    telemetry, context-retrieval guidance, cost auditing, and waste
    detection.

